# A PHP version is a release branch of php.net. Each fixture pins PHPUnit,
# PHPStan and PHP_CodeSniffer in its composer.lock, which a run installs, so
# the entries name no tools. PHPUnit 11 needs PHP 8.2, 12 PHP 8.3, 13 PHP
# 8.4.1; each lock is resolved for the lowest PHP its fixture runs on. The
# lines of PHPUnit 11 and 12 are held: the scout asks nothing newer for them.

[[entry]]
stack = "php"
runtime = "php"
version = "8.2"
fixture = "php-phpunit11"
kinds = ["lint", "types", "test", "coverage", "graph"]
held = "PHPUnit 11 proves the oldest PHP; newer PHP lines run php-phpunit13"

[[entry]]
stack = "php"
runtime = "php"
version = "8.3"
fixture = "php-phpunit12"
kinds = ["lint", "types", "test", "coverage", "graph"]
held = "PHPUnit 12 proves PHP 8.3; newer PHP lines run php-phpunit13"

