# The compatibility list: every combination of runtime, framework and tool
# versions loomux claims to support. One [[entry]] per runtime version; the
# fixture is the project under testdata/ that the combination is run against.
# Addon names are rows of verify's frameworks.toml, tool names are the tools
# the stack's presets bring; versions are given without a leading "v". An
# entry whose fixture stays below newer versions on purpose says why in
# held; the scout then asks nothing newer for it.

[[entry]]
stack = "gdscript"
runtime = "godot"
version = "3.6"
fixture = "godot3-gut"
kinds = ["test", "graph"]
addons = [{ name = "GUT", version = "7.4.3" }]

[[entry]]
stack = "gdscript"
runtime = "godot"
version = "3.6"
fixture = "godot3-plain"
kinds = ["lint", "graph"]
tools = { gdtoolkit = "3.*" }

[[entry]]
stack = "gdscript"
runtime = "godot"
