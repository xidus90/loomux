# A Java version is a feature release of Eclipse Temurin. The fixtures pin
# their plugins, test framework and Checkstyle themselves, and a run compiles
# them at the entry's version; Maven comes from CI's setup, Gradle through
# the fixture's wrapper, so the entries name no tools. JUnit 6 and
# Checkstyle 12 need Java 17, Checkstyle 14 Java 21: 8 and 11 run JUnit 5
# and Checkstyle 9.3, 17 JUnit 6 and Checkstyle 12.

[[entry]]
