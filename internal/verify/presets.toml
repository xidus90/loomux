# Presets of `loomux check` and of post-edit. The lanes use the schema of
# [verify.<stack>] in .loomux/config.toml, so whatever a preset can say, a
# project can say too. Parsed on first use, never at start.

ignored = [".txt", ".json", ".yaml", ".yml", ".toml", ".svg", ".png", ".jpg", ".jpeg", ".import", ".lock"]

[extensions]
".go" = "go"
".py" = "python"
".gd" = "gdscript"
".cpp" = "cpp"
".hpp" = "cpp"
".cc" = "cpp"
".cxx" = "cpp"
".c" = "cpp"
".h" = "cpp"
".ts" = "typescript"
".tsx" = "typescript"
".mts" = "typescript"
".cts" = "typescript"
".js" = "typescript"
".jsx" = "typescript"
".mjs" = "typescript"
".cjs" = "typescript"
".vue" = "vue"
".svelte" = "svelte"
".css" = "css"
".scss" = "css"
".sass" = "css"
".less" = "css"
".html" = "html"
".htm" = "html"
".cs" = "csharp"
".java" = "java"
".php" = "php"
".sh" = "shell"
".bash" = "shell"
".zsh" = "shell"
".sql" = "sql"
".rs" = "rust"
".md" = "wiki"

[stack.go]
tests_when = ["*_test.go"]

[stack.go.lint]
commands = ["go vet ./...", "{loomux} check gofmt ."]
# An edit formats only its own file: an unformatted file elsewhere is not
# the edit's to fix.
on_file = ["go vet ./...", "{loomux} check gofmt {file}"]
threaded = true

[stack.go.test]
commands = ["go test ./... -count=1"]
measuring = "go test ./... -count=1 -covermode=set -coverprofile={coverprofile}"

[stack.go.coverage]
commands = ["{loomux} check gocover --profile {coverprofile}"]
measure = "go test ./... -count=1 -covermode=set -coverprofile={coverprofile}"
after = "test"

# The graph lane is local by nature: it runs only where a graph was built,
# and a plan-time probe makes it not-applicable in CI, with nothing staged at
# a commit, and at a turn end with nothing changed against HEAD.
# The threshold counts every caller, tests among them.
[stack.go.graph]
commands = ["{loomux} check graph-fresh", "{loomux} check blast-audit --cached --threshold 5"]

# The rules read the repository root; the commit form reads the staged tree,
# the edit form the working tree.
[stack.go.rules]
commands = ["{loomux} check rules --cached"]
on_file  = ["{loomux} check rules"]

[stack.python]
tests_when = ["tests/", "test_*.py", "pyproject.toml:[tool.pytest"]

[stack.python.lint]
commands = ["uvx {from:ruff} ruff check . --output-format=concise"]

# `uv run`, not `uvx`: a type checker has to see the project's dependencies.
# `--with` lays the tool over the project's environment, so it still sees
# them, and a project that pins the tool keeps its pin; one that does not
# declare it gets it anyway instead of "Failed to spawn". Without mypy
# configuration there is no `files`, so the default names the root: mypy
# skips dot directories such as .venv, and --exclude-gitignore skips a venv
# the project ignores under another name.
[stack.python.types]
commands = ["uv run --with {tool:mypy} mypy --no-error-summary --no-pretty --exclude-gitignore ."]

# The first detected variant wins: with both configured, pyright checks.
[[stack.python.variant]]
when = "pyright"
[stack.python.variant.types]
commands = ["uv run pyright"]

# A project that configures mypy chooses its files there; a target on the
# command line would override them. Its configuration has to set `files`.
[[stack.python.variant]]
when = "mypy"
[stack.python.variant.types]
commands = ["uv run mypy --no-error-summary --no-pretty"]

[stack.python.test]
commands = ["uv run --with {tool:pytest} pytest -q --tb=short --no-header"]
measuring = "uv run --with {tool:coverage} --with {tool:pytest} coverage run -m pytest -q --tb=short --no-header"

# --skip-covered --skip-empty: the files at 100 % are the ones nobody reads;
# -m names the missing lines, which saves the repairer a round.
[stack.python.coverage]
commands = ["uv run --with {tool:coverage} coverage report --skip-covered --skip-empty -m"]
measure = "uv run --with {tool:coverage} --with {tool:pytest} coverage run -m pytest -q --tb=short --no-header"
after = "test"

# The graph belongs to the root, not to a stack: the same commands as Go's,
# and in a repository with both the plan runs one job, the highest-ranked stack's (Go's).
[stack.python.graph]
commands = ["{loomux} check graph-fresh", "{loomux} check blast-audit --cached --threshold 5"]

# The rules read the repository root; the commit form reads the staged tree,
# the edit form the working tree.
[stack.python.rules]
commands = ["{loomux} check rules --cached"]
on_file  = ["{loomux} check rules"]

# gdlint and gdformat ship in the package gdtoolkit; the registry has no
# package gdlint.
[stack.gdscript.lint]
commands = ["uvx --python <3.15 --with setuptools<81 --from {tool:gdtoolkit} gdlint .", "uvx --python <3.15 --with setuptools<81 --from {tool:gdtoolkit} gdformat --check ."]
on_file = ["uvx --python <3.15 --with setuptools<81 --from {tool:gdtoolkit} gdlint {file}", "uvx --python <3.15 --with setuptools<81 --from {tool:gdtoolkit} gdformat --check {file}"]

# The graph belongs to the root, and the highest-ranked active stack with a
# graph command carries it (go, python, gdscript, csharp, cpp): with Go or
# Python beside it their lane carries and this one stands aside; it carries in
# a project with neither.
[stack.gdscript.graph]
commands = ["{loomux} check graph-fresh", "{loomux} check blast-audit --cached --threshold 5"]

# The rules read the repository root; the commit form reads the staged tree,
# the edit form the working tree.
[stack.gdscript.rules]
commands = ["{loomux} check rules --cached"]
on_file  = ["{loomux} check rules"]

# gdUnit4 decides by the report, never by its exit code; see the cli reference.
# A pattern matches as a substring, so the bare name would answer to any
# plugin.cfg that merely mentions gdUnit4; the assignment is what the addon
# itself writes.
[stack.gdscript.test]
commands   = ["{loomux} check godot-suite --godot {godot}"]
measuring  = "{loomux} check godot-suite --godot {godot} --coverage {coverdata}"
lock       = true
when_found = ['plugin.cfg:name="gdUnit4"']

# The lane's own command does not name {godot}: a commit that skips `test`
# needs no binary for this lane either.
[stack.gdscript.coverage]
commands   = ["{loomux} check linecov --report {coverdata}"]
measure    = "{loomux} check godot-suite --godot {godot} --coverage {coverdata}"
after      = "test"
lock       = true
when_found = ['plugin.cfg:name="gdUnit4"', 'plugin.cfg:name="NanoCoverage"']

# GUT (7 for Godot 3, 9 for Godot 4) wins the test lane where its addon is
# found, gdUnit4 beside it or not; it measures no coverage, so coverage stays
# the gdUnit4 lane above. Its plugin.cfg says name="Gut", in both versions.
[[stack.gdscript.variant]]
when = "gut"
[stack.gdscript.variant.test]
commands   = ["{loomux} check gut-suite --godot {godot}"]
lock       = true
when_found = ['plugin.cfg:name="Gut"']

# dotnet test is the same whatever the framework, so there is no variant per
# framework. A test project for VSTest references the test SDK; one on
# xunit.v3 runs on Microsoft.Testing.Platform without it.
[stack.csharp]
tests_when = ["*.csproj:Microsoft.NET.Test.Sdk", "*.csproj:xunit.v3"]

# Every dotnet command restores and builds into obj/ and bin/; side by side
# they fight over the same files, so one lock binds every lane of the stack,
# and it is one lock for the whole repository (plan): a test project builds
# the project it references, which may be an area of its own.
# {solution} names the area's one solution: Godot writes it beside the
# project, and dotnet without a target refuses a folder holding both.
[stack.csharp.lint]
commands = ["dotnet format {solution} --verify-no-changes"]
on_file = ["dotnet format {solution} --verify-no-changes --include {file}"]
lock = true

[stack.csharp.types]
# A build that finds its outputs up to date compiles nothing and so replays
# no warning: after a dotnet test, -warnaserror alone would pass.
commands = ["dotnet build {solution} --nologo --no-incremental -warnaserror"]

# The collector writes into a fresh GUID directory below --results-directory;
# the run's own data path keeps reports of earlier runs out of reach.
[stack.csharp.test]
commands = ["dotnet test {solution} --nologo"]
measuring = 'dotnet test {solution} --nologo --collect "XPlat Code Coverage" --results-directory {coverdata}'

# ponytail: the report is a glob, so a root whose path holds a glob
# metacharacter such as [ finds no report; name it in --report if that bites.
[stack.csharp.coverage]
commands = ["{loomux} check linecov --report {coverdata}/*/coverage.cobertura.xml"]
measure = 'dotnet test {solution} --nologo --collect "XPlat Code Coverage" --results-directory {coverdata}'
after = "test"

# global.json choosing Microsoft.Testing.Platform puts dotnet test into its
# MTP mode, which refuses the VSTest collector. Coverage comes from
# Microsoft's extension, which a project must reference: without it the
# application rejects --coverage, so the test lane runs plainly and coverage
# runs the suite itself. The report lands flat in the run's data path under
# a GUID name.
[[stack.csharp.variant]]
when = "mtp"
[stack.csharp.variant.test]
commands = ["dotnet test {solution} --nologo"]
[stack.csharp.variant.coverage]
commands = ["{loomux} check linecov --report {coverdata}/*.cobertura.xml"]
measure = "dotnet test {solution} --nologo --results-directory {coverdata} -- --coverage --coverage-output-format cobertura"
after = "test"
when_found = ["*.csproj:Microsoft.Testing.Extensions.CodeCoverage"]

[stack.csharp.graph]
commands = ["{loomux} check graph-fresh", "{loomux} check blast-audit --cached --threshold 5"]

# The rules read the repository root; the commit form reads the staged tree,
# the edit form the working tree.
[stack.csharp.rules]
commands = ["{loomux} check rules --cached"]
on_file  = ["{loomux} check rules"]

[stack.cpp]
tests_when = ["CMakeLists.txt:enable_testing("]

# clang-tidy lints only the files it is named; run-clang-tidy names it every
# file of the build tree's compile commands. The edit form formats one file
# and runs without the tree, since needs guard only the commands.
[stack.cpp.lint]
commands = ["run-clang-tidy -p build -quiet"]
on_file = ["clang-format --dry-run --Werror {file}"]
needs = ["build/CMakeCache.txt"]

# The compiler is the type checker of C++; post-edit ran the build before.
# The lanes on the build tree need it configured. Configuring is a project
# decision (generator, options, toolchain), so without a CMakeCache.txt they
# wait out loud instead of guessing a configure step.
[stack.cpp.types]
commands = ["cmake --build build --parallel"]
needs = ["build/CMakeCache.txt"]

# ctest runs what the build built, so it waits for the types lane; the lanes
# would otherwise run side by side.
[stack.cpp.test]
commands = ["ctest --test-dir build --output-on-failure"]
needs = ["build/CMakeCache.txt"]
after = "types"

# --fail-under-line makes a gate of it: the old preset only wrote a report.
[stack.cpp.coverage]
commands = ["gcovr --root . --object-directory build --fail-under-line 100 --txt"]
after = "test"
needs = ["build/CMakeCache.txt"]

# The graph and the rules read the sources, not the build tree, so they need
# no configured build.
[stack.cpp.graph]
commands = ["{loomux} check graph-fresh", "{loomux} check blast-audit --cached --threshold 5"]

[stack.cpp.rules]
commands = ["{loomux} check rules --cached"]
on_file  = ["{loomux} check rules"]

# The base lanes are Maven's. A root pom.xml or Gradle build makes the root
# the only area (detection): it builds its modules, which checked on their own
# would compile beside it into the same target/ or build/.
# Every lane of a build writes the area's output directory, so one lock binds
# them; each variant's types lane carries it, since a variant replaces a lane
# whole.
# tests_when are the names Surefire runs by default; Gradle scans the compiled
# classes instead, and its tests follow the same names by convention.
[stack.java]
tests_when = ["*Test.java", "*Tests.java", "Test*.java", "*TestCase.java"]

# No Checkstyle reads every Java version: the last one that runs on Java 8
# cannot read Java 21, and the newest needs Java 21 to run. The project's
# pom.xml chooses the version, and without the plugin there is no lint.
[stack.java.lint]
commands = ["mvn -B -q checkstyle:check"]
when_found = ["pom.xml:maven-checkstyle-plugin"]

[stack.java.types]
commands = ["mvn -B -q -DskipTests compile test-compile"]
lock = true

# The plugin's full coordinates need no JaCoCo in the pom.xml. The test
# compiles first, so it waits for the types lane: a compile error leaves it
# blocked rather than red a second time.
[stack.java.test]
commands = ["mvn -B -q test"]
after = "types"
measuring = "mvn -B -q org.jacoco:jacoco-maven-plugin:0.8.16:prepare-agent test org.jacoco:jacoco-maven-plugin:0.8.16:report"

# Each module writes its own report: the second glob finds the modules one
# level below a root pom.xml.
[stack.java.coverage]
commands = ["{loomux} check linecov --report target/site/jacoco/jacoco.xml --report */target/site/jacoco/jacoco.xml"]
measure = "mvn -B -q org.jacoco:jacoco-maven-plugin:0.8.16:prepare-agent test org.jacoco:jacoco-maven-plugin:0.8.16:report"
after = "test"

[stack.java.graph]
commands = ["{loomux} check graph-fresh", "{loomux} check blast-audit --cached --threshold 5"]

# The rules read the repository root; the commit form reads the staged tree,
# the edit form the working tree.
[stack.java.rules]
commands = ["{loomux} check rules --cached"]
on_file  = ["{loomux} check rules"]

# An Android build has no compileJava, and its tasks depend on the build
# variant: the lanes of the build are the project's to write. The graph and
# the rules read the sources and stay.
[[stack.java.variant]]
when = "android"
lint = false
types = false
test = false
coverage = false

# Listed before Gradle, Maven wins where both builds are found in an area; it
# keeps the base lanes, and the origin of each lane names the build it won
# over.
[[stack.java.variant]]
when = "maven"

# {gradle} is the area's wrapper where it has one, else gradle on the PATH.
# The checkstyle tasks compile first, since their classpath holds the
# classes: a compile error shows in the lint as well.
[[stack.java.variant]]
when = "gradle"
[stack.java.variant.lint]
commands = ["{gradle} checkstyleMain checkstyleTest"]
when_found = ["build.gradle*:checkstyle"]
[stack.java.variant.types]
commands = ["{gradle} compileJava compileTestJava"]
lock = true
[stack.java.variant.test]
commands = ["{gradle} test"]
after = "types"

# Only the jacoco plugin brings jacocoTestReport, so the test lane cannot
# measure: a build without it would fail on the task. Coverage reports on
# what test left, or runs both itself.
[stack.java.variant.coverage]
commands = ["{gradle} jacocoTestReport", "{loomux} check linecov --report build/reports/jacoco/test/jacocoTestReport.xml --report */build/reports/jacoco/test/jacocoTestReport.xml"]
measure = "{gradle} test jacocoTestReport"
after = "test"
when_found = ["build.gradle*:jacoco"]

# The tools are the project's, installed by Composer into vendor/bin; before
# composer install each lane is unavailable, and an edit runs php -l alone,
# since a when_found path guards only the commands naming it. php runs the
# tools: the proxies there are PHP scripts, and one without an extension is no
# program on Windows. The {phpcs-…} and {phpstan-…} placeholders hold what
# each tool takes where the project has no configuration for it, and nothing
# where it has one; PHPStan without either one or sources is unavailable.
# tests_when is PHPUnit's default suffix.
[stack.php]
tests_when = ["*Test.php"]

[stack.php.lint]
commands = ["php vendor/bin/phpcs {phpcs-standard} {phpcs-files}"]
on_file = ["php vendor/bin/phpcs {phpcs-standard} {file}", "php -l {file}"]
when_found = ["vendor/bin/phpcs"]

[stack.php.types]
commands = ["php vendor/bin/phpstan analyse --no-progress {phpstan-defaults}"]
when_found = ["vendor/bin/phpstan"]

# linecov reads Cobertura, not Clover. The setting switches Xdebug on for
# this run alone; a command runs without a shell, so XDEBUG_MODE=… cannot.
[stack.php.test]
commands = ["php vendor/bin/phpunit"]
measuring = "php -d xdebug.mode=coverage vendor/bin/phpunit --coverage-cobertura {coverdata}"
when_found = ["vendor/bin/phpunit"]

[stack.php.coverage]
commands = ["{loomux} check linecov --report {coverdata}"]
measure = "php -d xdebug.mode=coverage vendor/bin/phpunit --coverage-cobertura {coverdata}"
after = "test"
when_found = ["vendor/bin/phpunit"]

[stack.php.graph]
commands = ["{loomux} check graph-fresh", "{loomux} check blast-audit --cached --threshold 5"]

# The rules read the repository root; the commit form reads the staged tree,
# the edit form the working tree.
[stack.php.rules]
commands = ["{loomux} check rules --cached"]
on_file  = ["{loomux} check rules"]

# JavaScript checks here too. Each lane waits for its tool in a node_modules
# of the area or above it, where npx finds a workspace's hoisted tools as
# well: without a TTY npx answers its own install prompt and fetches the
# newest version, unpinned. A variant's lane brings its own guard.
[stack.typescript]
# Tests are the files vitest and jest find by default: a runner with none
# to run fails, so a workspace member without tests has no test lane. Which
# runner is named stays with each lane's guard.
tests_when = ["*.test.*", "*.spec.*", "__tests__/"]

[stack.typescript.lint]
commands = ["npx eslint ."]
on_file = ["npx eslint --cache {file}"]
when_found = ["node_modules/.bin/eslint"]

[[stack.typescript.variant]]
when = "biome"
[stack.typescript.variant.lint]
commands = ["npx biome check ."]
on_file = ["npx biome check {file}"]
when_found = ["node_modules/.bin/biome"]

# Jest replaces vitest where the area names it. --ci fails on a missing
# snapshot instead of writing it; jest's default provider honours istanbul
# ignore, which linecov's nyc profile reads from the same report.
[[stack.typescript.variant]]
when = "jest"
[stack.typescript.variant.test]
commands = ["npx jest --ci"]
measuring = "npx jest --ci --coverage --coverageReporters=lcov"
when_found = ["node_modules/.bin/jest"]
[stack.typescript.variant.coverage]
commands = ["{loomux} check linecov --report coverage/lcov.info"]
measure = "npx jest --ci --coverage --coverageReporters=lcov"
after = "test"
when_found = ["node_modules/.bin/jest"]

# tsc looks for its tsconfig.json from the area upwards; one only in a
# subdirectory leaves it none of the project's files to check.
[stack.typescript.types]
commands = ["npx tsc --noEmit"]
when_found = ["./tsconfig.json", "node_modules/.bin/tsc"]

[stack.typescript.test]
commands = ["npx vitest run"]
measuring = "npx vitest run --coverage --coverage.reporter=lcov"
when_found = ["node_modules/.bin/vitest", "package.json:vitest"]

# vitest needs its coverage provider for --coverage; without it the test
# lane runs unmeasured.
[stack.typescript.coverage]
commands = ["{loomux} check linecov --report coverage/lcov.info"]
measure = "npx vitest run --coverage --coverage.reporter=lcov"
after = "test"
when_found = ["node_modules/.bin/vitest", "package.json:vitest", "node_modules/@vitest/coverage-v8/package.json"]

[stack.typescript.graph]
commands = ["{loomux} check graph-fresh", "{loomux} check blast-audit --cached --threshold 5"]

# The rules read the repository root; the commit form reads the staged tree,
# the edit form the working tree.
[stack.typescript.rules]
commands = ["{loomux} check rules --cached"]
on_file  = ["{loomux} check rules"]

[stack.vue.types]
commands = ["npx vue-tsc --noEmit"]

[stack.svelte.types]
commands = ["npx svelte-check"]

[stack.css.lint]
commands = ["npx stylelint **/*.{css,scss}"]
on_file = ["npx stylelint {file}"]

[stack.html.lint]
commands = ["npx htmlhint **/*.html"]
on_file = ["npx htmlhint {file}"]

[stack.shell.lint]
on_file = ["shellcheck {file}"]

[stack.sql.lint]
commands = ["sqlfluff lint ."]
on_file = ["sqlfluff lint {file}"]

[stack.rust.lint]
commands = ["cargo clippy -- -D warnings", "cargo fmt --check"]
