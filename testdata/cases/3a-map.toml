# Stage 3a translates the four commands of brain-mcp, the Python reference's
# console script, that write: reconcile, reindex, embed and init. `brain init`
# lives on as `loomux area add`, without its host half.

# `area add` writes the manifest, so the recorded one is held against loomux's
# byte for byte: moved, not decoded and encoded again. A top-level key, and so
# above every table.
manifests = "verbatim"

[[command]]
from = "brain-mcp reconcile"
to   = "loomux reconcile"

[[command]]
from = "brain-mcp reindex"
to   = "loomux reindex"

[[command]]
from = "brain-mcp embed"
to   = "loomux embed"

[[command]]
from = "brain-mcp init "
to   = "loomux area add "

# Deviation "area add, Schlüssel des Merge-Zweigs" in parity/stufe-3a.md:
# `brain init` writes `merge_branch`, which its own reader never reads; loomux
# writes `branch`, the key both readers read.
[[manifest_key]]
from = "merge_branch"
to   = "branch"
