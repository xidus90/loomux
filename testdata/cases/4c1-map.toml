# The local model's cases are all `reconcile`, the one command of brain-mcp
# that asks the model; the row is 3a-map.toml's.

# The same key as in 3a-map.toml: a recorded manifest is moved, not decoded
# and encoded again. A top-level key, and so above every table.
manifests = "verbatim"

[[command]]
from = "brain-mcp reconcile"
to   = "loomux reconcile"
