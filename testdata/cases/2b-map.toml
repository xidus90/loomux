# Stage 2b translates ultraloom commit-msg to loomux check commit-msg.

[[command]]
from = "ultraloom commit-msg "
to   = "loomux check commit-msg "

# A refusal exits 2 in ultraloom and 1 in loomux (deviation 5).
[[exit]]
from = 2
to   = 1

# Only refusals are recorded here; a usage error exits 2 in both tools and
# must not be mapped.
