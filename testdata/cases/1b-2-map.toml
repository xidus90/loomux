# Stage 1b-2 renames the five MCP tools into the brain family. The protocol has
# no nested tools, and the code graph will put graph_* into the same server, so
# the prefix is the only family separation available. It is a translation rule
# and no deviation: nothing about an answer changes with the name.

[[tool]]
from = "search"
to   = "brain_search"

[[tool]]
from = "catalog"
to   = "brain_catalog"

[[tool]]
from = "read"
to   = "brain_read"

[[tool]]
from = "neighbors"
to   = "brain_neighbors"

[[tool]]
from = "status"
to   = "brain_status"
