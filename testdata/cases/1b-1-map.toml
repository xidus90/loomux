# Stage 1b-1 translates one command prefix and rewrites the advice. brain-mcp
# is the console script of the Python reference; its five read commands live
# under loomux brain.

[[command]]
from = "brain-mcp "
to   = "loomux brain "

# Deviation "Ratschläge nennen loomux" in parity/stufe-1b-1.md: the reference
# advises its own commands, loomux advises its own.
[[stdout]]
from = "run `brain reindex`"
to   = "run `loomux reindex`"

[[stdout]]
from = "run `brain reconcile`"
to   = "run `loomux reconcile`"

[[stdout]]
from = "run `brain embed`"
to   = "run `loomux embed`"
