<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>loomux</title>
  <desc>One Go binary that guards AI coding agents: hooks and a write barrier, a check chain, a code graph and a project wiki.</desc>
  <rect width="1280" height="640" fill="#0d1117"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="190" font-size="120" font-weight="700" fill="#ffffff">loomux</text>
    <text font-size="36" fill="#c9d1d9">
      <tspan x="80" y="262">One Go binary that guards AI coding agents: hooks and</tspan>
      <tspan x="80" y="312">a write barrier, a check chain, a code graph and a project wiki.</tspan>
    </text>
    <g font-size="30" fill="#e6edf3">
      <text x="116" y="420">loomux itself needs no Python or Node</text>
      <text x="116" y="475">Guard decisions within 35 ms</text>
      <text x="116" y="530">100 % coverage per function</text>
    </g>
  </g>

