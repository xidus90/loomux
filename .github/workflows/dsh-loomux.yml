name: dsh-loomux
on:
  push:
    tags: ['dsh-loomux-v*']
  pull_request:
    paths:
      - 'dsh-loomux/**'
      - 'ci/dsh-loomux.sh'
      - '.github/workflows/dsh-loomux.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dsh-loomux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - run: sh ci/dsh-loomux.sh
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/dsh-loomux-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          registry-url: https://registry.npmjs.org
      - name: the tag names the version
        run: |
          version="$(node -p "require('./dsh-loomux/package.json').version")"
          test "${GITHUB_REF_NAME}" = "dsh-loomux-v${version}"
      - name: publish
        run: npm publish --provenance --access public dsh-loomux
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
