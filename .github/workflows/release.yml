name: release
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: pr releases a merged pull request, beta cuts a beta from ref
        type: choice
        options: [pr, beta]
        default: pr
      pr:
        description: Number of the merged pull request to release (mode pr)
        type: number
      ref:
        description: Branch, tag or commit to cut the beta from (mode beta)
        type: string
      bump:
        description: Which part of the version the beta raises (mode beta)
        type: choice
        options: [major, minor, patch]
        default: minor
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    # event == push: a pull request from a fork branch named master must not
    # pass as a merge.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: [self-hosted, ubuntu-latest]
    steps:
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The self-hosted runners keep Go's caches between runs; saving
          # them as an Actions cache would pack the whole local build cache.
          cache: false
      - run: go build -o "$RUNNER_TEMP/loomux" ./cmd/loomux
      - run: bash .github/scripts/${{ inputs.mode == 'beta' && 'release-beta.sh' || 'release.sh' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_PR: ${{ inputs.pr }}
          REF: ${{ inputs.ref }}
          BUMP: ${{ inputs.bump }}
          LOOMUX: ${{ runner.temp }}/loomux
