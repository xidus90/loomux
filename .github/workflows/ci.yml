name: ci
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    # The release commit touches only the changelog; running ci on it would
    # start a release run that can cancel a pending one of a real merge.
    paths-ignore: [CHANGELOG.md]
permissions:
  contents: read
jobs:
  gate-windows:
    runs-on: [self-hosted, windows-latest]
    defaults:
      run:
        # Git Bash by its path: a bare `bash` on a self-hosted runner can
        # resolve to WSL's System32 launcher, which cannot open the script
        # the runner hands it under a Windows path. The 8.3 name, because
        # the runner does not unquote a quoted path with a space in it.
        shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The self-hosted runners keep Go's caches between runs; saving
          # them as an Actions cache would pack the whole local build cache.
          cache: false
      - run: sh ci/gate.sh
      - run: go build -o bin/loomux.exe ./cmd/loomux
      - run: sh ci/smoke.sh bin/loomux.exe
  # Linux does not run the test gate: several tests and the coverage of
  # about 33 functions are bound to Windows, so the gate can only pass there.
  # This leg keeps the Linux build honest with vet, a build and the smoke test.
  # child's process group arm only runs here, so its tests run here too.
  build-linux:
    runs-on: [self-hosted, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The self-hosted runners keep Go's caches between runs; saving
          # them as an Actions cache would pack the whole local build cache.
          cache: false
      - run: go vet ./...
      - run: go test ./internal/child/...
      - run: go build -o bin/loomux.exe ./cmd/loomux
      - run: sh ci/smoke.sh bin/loomux.exe
