name: compat
# Runs the compatibility list (internal/compat/compat.toml) for real: each
# entry on Linux and Windows (C++ on Linux only, see internal/compat/matrix.go),
# with its runtime, addons and tool versions.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      entries:
        description: Entry keys, comma separated; empty runs all
        type: string
        default: ""
  workflow_call:
    inputs:
      entries:
        description: Entry keys as a JSON list; empty runs all
        type: string
        default: ""
      probes:
        description: Whole entries as a JSON list, from `dev compat scout`; when given, only these run
        type: string
        default: ""
permissions:
  contents: read
jobs:
  pick:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit
  plan:
    needs: pick
    runs-on: ${{ fromJSON(needs.pick.outputs.linux) }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The plan diffs against the point the branch left master.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go build -o bin/loomux.exe ./cmd/loomux
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          ENTRIES: ${{ inputs.entries }}
          PROBES: ${{ inputs.probes }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          matrix=$(sh ci/compat-plan.sh bin/loomux.exe)
          echo "$matrix"
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
  # One job per stack, so the run groups its entries by language. A stack
  # the plan left empty is skipped; internal/compat/bystack_test.go holds this
  # list to the stacks of compat.toml.
  go:
    needs: [pick, plan]
    if: toJSON(fromJSON(needs.plan.outputs.matrix).go.include) != '[]'
    uses: ./.github/workflows/compat-run.yml
    with:
      stack: go
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrix).go) }}
      linux: ${{ needs.pick.outputs.linux }}
      windows: ${{ needs.pick.outputs.windows }}
  python:
    needs: [pick, plan]
    if: toJSON(fromJSON(needs.plan.outputs.matrix).python.include) != '[]'
    uses: ./.github/workflows/compat-run.yml
    with:
      stack: python
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrix).python) }}
      linux: ${{ needs.pick.outputs.linux }}
      windows: ${{ needs.pick.outputs.windows }}
  gdscript:
    needs: [pick, plan]
    if: toJSON(fromJSON(needs.plan.outputs.matrix).gdscript.include) != '[]'
    uses: ./.github/workflows/compat-run.yml
    with:
      stack: gdscript
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrix).gdscript) }}
      linux: ${{ needs.pick.outputs.linux }}
      windows: ${{ needs.pick.outputs.windows }}
  csharp:
    needs: [pick, plan]
    if: toJSON(fromJSON(needs.plan.outputs.matrix).csharp.include) != '[]'
    uses: ./.github/workflows/compat-run.yml
    with:
      stack: csharp
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrix).csharp) }}
      linux: ${{ needs.pick.outputs.linux }}
      windows: ${{ needs.pick.outputs.windows }}
  cpp:
    needs: [pick, plan]
    if: toJSON(fromJSON(needs.plan.outputs.matrix).cpp.include) != '[]'
    uses: ./.github/workflows/compat-run.yml
    with:
      stack: cpp
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrix).cpp) }}
      linux: ${{ needs.pick.outputs.linux }}
      windows: ${{ needs.pick.outputs.windows }}
  java:
    needs: [pick, plan]
    if: toJSON(fromJSON(needs.plan.outputs.matrix).java.include) != '[]'
    uses: ./.github/workflows/compat-run.yml
    with:
      stack: java
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrix).java) }}
      linux: ${{ needs.pick.outputs.linux }}
      windows: ${{ needs.pick.outputs.windows }}
  php:
    needs: [pick, plan]
    if: toJSON(fromJSON(needs.plan.outputs.matrix).php.include) != '[]'
    uses: ./.github/workflows/compat-run.yml
    with:
      stack: php
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrix).php) }}
      linux: ${{ needs.pick.outputs.linux }}
      windows: ${{ needs.pick.outputs.windows }}
  typescript:
    needs: [pick, plan]
    if: toJSON(fromJSON(needs.plan.outputs.matrix).typescript.include) != '[]'
    uses: ./.github/workflows/compat-run.yml
    with:
      stack: typescript
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrix).typescript) }}
      linux: ${{ needs.pick.outputs.linux }}
      windows: ${{ needs.pick.outputs.windows }}
  html:
    needs: [pick, plan]
    if: toJSON(fromJSON(needs.plan.outputs.matrix).html.include) != '[]'
    uses: ./.github/workflows/compat-run.yml
    with:
      stack: html
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrix).html) }}
      linux: ${{ needs.pick.outputs.linux }}
      windows: ${{ needs.pick.outputs.windows }}
  css:
    needs: [pick, plan]
    if: toJSON(fromJSON(needs.plan.outputs.matrix).css.include) != '[]'
    uses: ./.github/workflows/compat-run.yml
    with:
      stack: css
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.matrix).css) }}
      linux: ${{ needs.pick.outputs.linux }}
      windows: ${{ needs.pick.outputs.windows }}
  # The required check: green when the plan passed and no stack failed or
  # was cancelled; a skipped stack had nothing to run.
  compat:
    needs: [plan, go, python, gdscript, csharp, cpp, java, php, typescript, html, css]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          PLAN: ${{ needs.plan.result }}
        run: |
          echo "plan: $PLAN, results: $RESULTS"
          [ "$PLAN" = success ] && ! printf '%s' "$RESULTS" | grep -q -E '"(failure|cancelled)"'
